stack:
  agent:
    factory: agents.normal_agent:NormalAgent
    params:
      model: gpt-5-mini
      max_iterations: 80
      tools:
        - nav.observe
        - nav.move.discrete
        - nav.goal.finish
        - vln.navigate.start
        - vln.navigate.status
        - vln.navigate.cancel
        - spatial.search
        - spatial.remember
