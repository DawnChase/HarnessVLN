stack:
  environment:
    factory: envs.isaac_vlnverse:from_case
    serial: true
    params:
      session_params:
        internutopia_root: cache/upstream/internutopia
        project_root: cache/upstream/vlnverse
        eval_config: scripts/eval/configs/h1_internvla_n1_cfg_vlnverse_coarse.py
        scene_data_dir: data/scene_datasets/vlnverse
        robot_usd_path: data/Embodiments/vln-pe/h1/h1_internvla.usd
        headless: true
        accept_eula: true
      flash: true
      frame: isaac_world
      forward_m: 0.25
      turn_deg: 15.0
      max_native_ticks_per_action: 2000
runner:
  parallelism: 1
  timeout_s: 3600
  shutdown_timeout_s: 60
provenance:
  simulator: Isaac Sim 4.5.0
  middleware: InternUtopia 2.2.1 source overlay
  middleware_commit: b0a9520c586317c2743023c153cbf7c4f04f4732
