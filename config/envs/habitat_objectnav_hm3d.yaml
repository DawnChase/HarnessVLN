stack:
  environment:
    factory: envs.habitat:from_case
    params:
      native_factory: envs.habitat:create_native_session
      native_factory_params:
        config_path: benchmark/nav/objectnav/objectnav_hm3d.yaml
        source_root: cache/upstream/habitat_lab
        config_values:
          habitat.dataset.split: val
          habitat.dataset.data_path: data/datasets/objectnav/hm3d/v2/{split}/{split}.json.gz
          habitat.dataset.scenes_dir: data/scene_datasets
        scene_id_rewrites:
          data/scene_datasets/hm3d_v0.2/: data/scene_datasets/hm3d/
        scene_dataset_config: data/scene_datasets/hm3d/val/hm3d_annotated_val_basis.scene_dataset_config.json
      native_actions:
        forward: 1
        turn_left: 2
        turn_right: 3
        look_up: 4
        look_down: 5
      goal_finish_action: 0
      observation_channels: [rgb, depth, gps, compass, objectgoal]
      expose_pose: true
      forward_m: 0.25
      turn_deg: 30.0
      camera: {height: 480, width: 640, hfov_deg: 79}
runner:
  parallelism: 2
  timeout_s: 1800
  shutdown_timeout_s: 30
provenance:
  simulator: Habitat-Lab/Sim 0.3.3
  simulator_commit: acbe6f4922e68145e401e55c30f9dfea460a3f24
  habitat_lab_commit: 094d6be2f9d057e4781a68ae792132895fd4d3d0
