stack:
  environment:
    factory: envs.isaac_vln_pe:from_case
    serial: true
    params:
      session_params:
        internutopia_root: cache/upstream/internutopia
        project_root: cache/upstream/internnav
        eval_config: scripts/eval/configs/h1_cma_cfg.py
        scene_data_dir: data/scene_datasets/mp3d_pe
        robot_usd_path: data/assets/vln_pe/Embodiments/vln-pe/h1/h1_vln_pointcloud.usd
        headless: true
        accept_eula: true
      frame: isaac_world
      forward_m: 0.25
      turn_deg: 15.0
      max_native_ticks_per_action: 2000
runner:
  parallelism: 1
  timeout_s: 3600
  shutdown_timeout_s: 60
provenance:
  simulator: Isaac Sim 4.5.0
  middleware: InternUtopia 2.2.1 source overlay
  middleware_commit: b0a9520c586317c2743023c153cbf7c4f04f4732
