environment:
    factory: envs.goat:from_episode
    params:
      native_factory_params:
        goat_root: cache/upstream/goat_bench
        habitat_root: cache/upstream/habitat_lab
        config_path: benchmark/nav/objectnav/objectnav_hm3d.yaml
        scene_dataset_config: data/scene_datasets/hm3d/val/hm3d_annotated_val_basis.scene_dataset_config.json
        config_values:
          habitat.environment.max_episode_steps: 5000
          habitat.dataset.type: Goat-v1
          habitat.dataset.split: val_unseen
          habitat.dataset.data_path: data/datasets/goat_bench/hm3d/v1/{split}/{split}.json.gz
          habitat.dataset.scenes_dir: data/scene_datasets
          habitat.task.type: Goat-v1
          habitat.simulator.type: Sim-v0
          habitat.simulator.turn_angle: 30
          habitat.simulator.default_agent_navmesh: true
          habitat.simulator.agents.main_agent.height: 1.41
          habitat.simulator.agents.main_agent.radius: 0.17
          habitat.simulator.agents.main_agent.max_climb: 0.20
          habitat.simulator.agents.main_agent.sim_sensors.rgb_sensor.width: 360
          habitat.simulator.agents.main_agent.sim_sensors.rgb_sensor.height: 640
          habitat.simulator.agents.main_agent.sim_sensors.rgb_sensor.hfov: 42
          habitat.simulator.agents.main_agent.sim_sensors.rgb_sensor.position: [0, 1.31, 0]
      native_actions:
        forward: move_forward
        turn_left: turn_left
        turn_right: turn_right
        look_up: look_up
        look_down: look_down
      goal_finish_action: subtask_stop
      observation_channels: [rgb, gps, compass]
      expose_pose: true
      forward_m: 0.25
      turn_deg: 30.0
      camera: {height: 640, width: 360, hfov_deg: 42}
provenance:
  simulator: Habitat-Lab/Sim 0.3.3
  simulator_commit: acbe6f4922e68145e401e55c30f9dfea460a3f24
  habitat_lab_commit: 094d6be2f9d057e4781a68ae792132895fd4d3d0
  upstream_commit: 74c41d19d4a4c3608d1575b512087b5a529aee0e
